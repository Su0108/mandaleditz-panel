name: Build Android APK

# Runs entirely on GitHub's servers — nothing to install on your own device.
# Trigger it either automatically (push to main) or manually from the Actions tab.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ONESIGNAL_DISABLE_LOCATION: "true"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets + native plugins
        run: npx cap sync android

      - name: Wire up Firebase (google-services.json), if present
        run: |
          if [ -f google-services.json ]; then
            echo "Found google-services.json — enabling Firebase/FCM in the Android build."
            cp google-services.json android/app/google-services.json

            # Add the Google Services Gradle plugin classpath at the project level.
            sed -i "s#dependencies {#dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'#" android/build.gradle

            # Apply the plugin at the app module level.
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          else
            echo "No google-services.json in the repo root yet — skipping Firebase wiring."
            echo "Push notifications on the APK will not work until you add it (see GUIDE.md)."
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mandaleditz-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
