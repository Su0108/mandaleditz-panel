<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANDALEDITZ — Everything Is Here</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#c6ff2e">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --bg:#18181a;
    --bg-elev:#0f0f10;
    --pill:#4b4b4d;
    --pill-2:#3a3a3c;
    --card:#111112;
    --lime:#c6ff2e;
    --white:#f2f2f2;
    --muted:#9a9a9d;
    --danger:#ff5a5a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--white);
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;}

  /* ---------- SPLASH ---------- */
  .splash-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:var(--bg);gap:22px;}
  .splash-logo{font-size:38px;font-weight:900;letter-spacing:-1px;opacity:0;animation:splashFade .6s ease forwards;}
  .splash-logo .m{color:var(--lime);}
  .splash-logo .e{color:var(--white);}
  .splash-sub{color:var(--muted);font-size:12px;letter-spacing:2px;opacity:0;animation:splashFade .6s ease .15s forwards;}
  .splash-spinner{width:26px;height:26px;border-radius:50%;border:2.5px solid #2a2a2c;border-top-color:var(--lime);opacity:0;animation:splashSpin .8s linear infinite, splashFade .6s ease .3s forwards;}
  @keyframes splashFade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @keyframes splashSpin{to{transform:rotate(360deg);}}

  /* ---------- LOGIN ---------- */
  .login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px;}
  .logo-block{text-align:center;margin-bottom:36px;}
  .logo-main{font-size:44px;font-weight:900;letter-spacing:-1px;line-height:1;}
  .logo-main .m{color:var(--lime);}
  .logo-main .e{color:var(--white);}
  .logo-sub{color:var(--muted);font-size:15px;margin-top:6px;letter-spacing:1px;}
  .login-card{background:var(--card);border-radius:22px;padding:36px 28px;width:100%;max-width:380px;}
  .field{margin-bottom:34px;}
  .field label{display:block;color:var(--muted);font-size:14px;margin-bottom:10px;}
  .field input{width:100%;background:transparent;border:none;border-bottom:1.5px solid var(--muted);color:var(--white);font-size:18px;padding:4px 2px 10px;outline:none;}
  .field input:focus{border-bottom-color:var(--lime);}
  .field.pass-field{position:relative;}
  .pass-eye{position:absolute;right:2px;bottom:10px;color:var(--muted);font-size:18px;cursor:pointer;user-select:none;}
  .btn-login{width:100%;background:#f2f2f2;color:#111;border:none;border-radius:999px;padding:16px;font-size:17px;font-weight:700;letter-spacing:1px;cursor:pointer;margin-top:8px;}
  .btn-login:disabled{opacity:.6;}
  .otp-resend{text-align:center;margin-top:14px;font-size:13px;color:var(--muted);cursor:pointer;text-decoration:underline;}
  .btn-login:active{transform:scale(0.98);}
  .login-error{color:var(--danger);font-size:13px;text-align:center;margin-top:14px;min-height:16px;}
  .demo-hint{margin-top:22px;color:var(--muted);font-size:12px;text-align:center;line-height:1.6;}
  .demo-hint b{color:var(--lime);}

  /* ---------- HEADER ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 14px;}
  .brand{display:flex;flex-direction:column;line-height:1;cursor:pointer;}
  .brand .b1{font-size:22px;font-weight:900;}
  .brand .b1 .m{color:var(--lime);}
  .brand .b2{color:var(--muted);font-size:9px;letter-spacing:1px;margin-top:2px;}
  .top-right{display:flex;align-items:center;gap:14px;}
  .user-name{color:var(--white);font-size:15px;text-decoration:underline;text-underline-offset:4px;cursor:pointer;}
  .menu-dots{cursor:pointer;color:var(--white);font-size:20px;padding:4px 8px;line-height:1;letter-spacing:2px;}
  .menu-dots::before{content:"⋮";}

  /* dropdown */
  .dropdown{position:absolute;top:58px;right:16px;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:50;min-width:170px;display:none;}
  .dropdown.open{display:block;}
  .dropdown div{padding:14px 18px;font-size:14px;cursor:pointer;color:var(--white);border-bottom:1px solid #2a2a2c;}
  .dropdown div:last-child{border-bottom:none;}
  .dropdown div:hover{background:var(--pill-2);}
  .dropdown .danger{color:var(--danger);}

  /* ---------- SEARCH ---------- */
  .search-wrap{padding:6px 20px 16px;}
  .search-bar{width:100%;background:var(--pill);border:none;border-radius:999px;padding:16px 20px;color:var(--white);font-size:16px;outline:none;}
  .search-bar::placeholder{color:#d8d8d8;text-align:left;}

  /* ---------- TABS ---------- */
  .tabs{display:flex;gap:10px;padding:0 20px 18px;overflow-x:auto;}
  .tab{background:var(--pill);color:var(--white);border-radius:999px;padding:12px 18px;font-size:15px;white-space:nowrap;cursor:pointer;flex:0 0 auto;}
  .tab.active{color:var(--lime);}

  .content{flex:1;padding:0 20px 90px;overflow-y:auto;}

  /* ---------- CHAT LIST ---------- */
  .chat-row{display:flex;align-items:center;gap:16px;padding:14px 0;cursor:pointer;border-bottom:1px solid #232325;}
  .avatar{width:58px;height:58px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;position:relative;}
  .avatar svg{width:34px;height:34px;fill:#111;}
  .chat-meta{flex:1;min-width:0;}
  .chat-name{color:var(--lime);font-size:19px;font-weight:600;margin-bottom:4px;}
  .chat-last{color:var(--white);font-size:14px;display:flex;align-items:center;gap:6px;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chat-time{color:var(--muted);font-size:13px;flex:0 0 auto;}
  .check{color:var(--lime);}

  .empty-state{color:var(--muted);text-align:center;padding:60px 20px;font-size:14px;line-height:1.7;}
  .chat-row.unread{background:rgba(198,255,46,.08);border-left:3px solid var(--lime);padding-left:11px;}
  .chat-row.unread .chat-name{font-weight:800;}
  .chat-row.unread .chat-last{color:var(--white);opacity:1;font-weight:600;}

  /* ---------- THREAD ---------- */
  .thread{display:flex;flex-direction:column;height:100%;height:100dvh;}
  .thread-header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid #232325;}
  .back-btn{color:var(--lime);font-size:22px;cursor:pointer;padding:4px 6px;}
  .thread-title{font-size:18px;font-weight:700;}
  .thread-msgs{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
  .msg-block{max-width:78%;}
  .msg-block.mine{align-self:flex-end;text-align:right;}
  .msg-sender{color:var(--lime);font-size:13px;margin-bottom:4px;padding:0 4px;}
  .msg-bubble{background:var(--pill);border-radius:20px;padding:14px 18px;font-size:15px;display:inline-block;text-align:left;}
  .msg-time{color:var(--muted);font-size:11px;margin-top:4px;padding:0 4px;}
  .thread-input-wrap{display:flex;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid #232325;background:var(--bg);}
  .thread-input{flex:1;background:var(--pill);border:none;border-radius:999px;padding:14px 20px;color:var(--white);font-size:15px;outline:none;}
  .emoji-ico{font-size:20px;color:var(--white);opacity:.7;cursor:pointer;}
  .emoji-panel{position:absolute;bottom:64px;left:8px;right:8px;max-width:360px;background:rgba(30,30,32,.97);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:400;padding:10px;}
  body.theme-light .emoji-panel{background:rgba(255,255,255,.97);border-color:rgba(0,0,0,.08);}
  .emoji-cat-row{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid rgba(255,255,255,.08);}
  .emoji-cat-btn{font-size:18px;padding:5px 7px;border-radius:8px;cursor:pointer;flex:0 0 auto;opacity:.55;}
  .emoji-cat-btn.active{opacity:1;background:rgba(198,255,46,.18);}
  .emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-height:180px;overflow-y:auto;}
  .emoji-opt{font-size:20px;text-align:center;padding:5px 0;border-radius:8px;cursor:pointer;}
  .emoji-opt:active{background:rgba(198,255,46,.2);}
  .thread-input-wrap{position:relative;}
  .send-btn{width:38px;height:38px;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;}
  .send-btn svg{fill:#e8c400;width:26px;height:26px;}

  /* ---------- BROADCAST ---------- */
  .bc-msg{margin-bottom:20px;max-width:82%;}
  .bc-msg.mine{margin-left:auto;text-align:right;}
  .bc-sender{color:var(--lime);font-size:14px;margin-bottom:6px;}
  .bc-bubble{background:var(--pill);border-radius:20px;padding:16px 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;font-size:16px;}
  .bc-bubble .t{color:var(--muted);font-size:12px;white-space:nowrap;}

  /* ---------- HISTORY / TASKS ---------- */
  .task-card{background:var(--card);border-radius:20px;padding:22px 22px 10px;margin-bottom:22px;}
  .task-poster{color:var(--lime);font-size:15px;margin-bottom:10px;padding-left:4px;}
  .task-row{margin-bottom:10px;font-size:15px;color:var(--white);line-height:1.5;}
  .task-row b{font-weight:600;}
  .task-row a{color:var(--lime);text-decoration:none;word-break:break-all;}
  .task-link-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .task-link-row .link-text{flex:1;min-width:0;}
  .copy-btn{flex:0 0 auto;display:flex;align-items:center;gap:5px;background:var(--pill-2);color:var(--white);border:none;border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;}
  .copy-btn:active{transform:scale(0.95);}
  .copy-btn.copied{color:var(--lime);}
  .copy-btn svg{width:13px;height:13px;fill:currentColor;flex:0 0 auto;}
  .copy-toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(10px);background:#1c1c1e;color:var(--lime);padding:10px 20px;border-radius:16px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:999;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;max-width:88%;text-align:center;white-space:normal;}
  .copy-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .task-actions{display:flex;background:#1c1c1e;border-radius:999px;overflow:hidden;margin-top:14px;}
  .task-actions button{flex:1;border:none;padding:16px;font-size:18px;font-weight:600;cursor:pointer;background:transparent;}
  .btn-decline{background:#f2f2f2;color:#111;border-radius:999px 0 0 999px;}
  .btn-accept{color:var(--lime);}
  .task-status{background:#1c1c1e;border-radius:999px;padding:16px;text-align:center;color:var(--lime);font-size:18px;font-weight:700;margin-top:14px;}
  .task-status.declined{color:var(--muted);}

  /* ---------- PAYMENTS ---------- */
  .pay-card{background:var(--card);border-radius:20px;padding:22px;margin-bottom:22px;}
  .pay-from{color:var(--lime);font-size:15px;margin-bottom:14px;}
  .pay-amount{color:var(--lime);font-size:38px;font-weight:900;margin-bottom:12px;}
  .pay-amount .rs{font-size:26px;}
  .pay-txn{color:var(--white);font-size:14px;margin-bottom:16px;opacity:.85;}
  .pay-status{background:#1c1c1e;border-radius:999px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}
  .pay-status .lbl{font-size:22px;font-weight:700;}
  .pay-status .dt{font-size:14px;color:var(--white);text-align:right;line-height:1.4;}

  /* ---------- FORMS / ADMIN ---------- */
  .panel-title{font-size:20px;font-weight:800;margin:10px 0 18px;color:var(--lime);}
  .subsection{margin-bottom:32px;}
  .subsection h3{font-size:15px;color:var(--muted);margin-bottom:14px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
  .form-input,.form-textarea{width:100%;background:var(--pill-2);border:1px solid #3d3d3f;border-radius:12px;padding:13px 16px;color:var(--white);font-size:15px;margin-bottom:12px;outline:none;}
  .form-input:focus,.form-textarea:focus{border-color:var(--lime);}
  .avatar-upload-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .upload-btn{display:inline-flex;align-items:center;gap:6px;background:var(--pill-2);border:1px solid #3d3d3f;border-radius:12px;padding:10px 14px;font-size:13px;color:var(--lime);cursor:pointer;flex:1;justify-content:center;}
  .upload-btn:active{transform:scale(0.97);}
  .avatar-preview{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:0 0 auto;background:var(--pill-2);}
  .avatar-preview img{width:100%;height:100%;object-fit:cover;}
  .form-textarea{resize:vertical;min-height:60px;font-family:inherit;}
  .form-btn{width:100%;background:var(--lime);color:#111;border:none;border-radius:999px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;}
  .form-btn:active{transform:scale(.98);}
  .form-btn.secondary{background:var(--pill);color:var(--white);}
  .user-list-item{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:14px;}
  .user-list-item .u-name{font-weight:600;color:var(--white);}
  .user-list-item .u-meta{color:var(--muted);font-size:12px;margin-top:2px;}
  .badge-admin{background:var(--lime);color:#111;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;margin-left:8px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--lime);color:#111;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s;box-shadow:0 6px 18px rgba(0,0,0,.4);}
  .toast.show{opacity:1;bottom:36px;}
  .back-row{display:flex;align-items:center;gap:12px;margin-bottom:6px;cursor:pointer;color:var(--lime);font-size:15px;}

  /* ---------- LIGHT THEME ---------- */
  body.theme-light{
    --bg:#f3f3f4; --bg-elev:#ffffff; --pill:#e2e2e4; --pill-2:#eaeaec;
    --card:#ffffff; --white:#141414; --muted:#6b6b6f;
  }
  body.theme-light .chat-row,body.theme-light .task-card,body.theme-light .pay-card,body.theme-light .item-card{box-shadow:0 1px 4px rgba(0,0,0,.08);}
  body.theme-light .msg-bubble,body.theme-light .bc-bubble,body.theme-light .thread-input,body.theme-light .search-bar{background:#e6e6e8;}
  body.theme-light .dropdown{box-shadow:0 8px 24px rgba(0,0,0,.15);}

  /* ---------- NOTIF DOTS ---------- */
  .tab{position:relative;}
  .notif-dot{position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--danger);}
  .menu-dots{position:relative;}
  .menu-dots .notif-dot{top:0;right:-2px;}

  /* ---------- FILTER CHIPS ---------- */
  .chip-row{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;}
  .chip{background:var(--pill);color:var(--white);border-radius:999px;padding:9px 15px;font-size:13px;white-space:nowrap;cursor:pointer;flex:0 0 auto;opacity:.75;}
  .chip.active{color:#111;background:var(--lime);opacity:1;font-weight:700;}

  /* ---------- ADMIN SUB-NAV ---------- */
  .admin-tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:22px;padding-bottom:2px;}
  .admin-tab{background:var(--pill);color:var(--white);border-radius:999px;padding:10px 16px;font-size:13px;white-space:nowrap;cursor:pointer;flex:0 0 auto;}
  .admin-tab.active{color:#111;background:var(--lime);font-weight:700;}

  /* ---------- STAT GRID ---------- */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px;}
  .stat-card{background:var(--card);border-radius:16px;padding:18px;}
  .stat-num{font-size:26px;font-weight:900;color:var(--lime);line-height:1;}
  .stat-lbl{color:var(--muted);font-size:12px;margin-top:8px;}

  /* ---------- ITEM CARD (admin lists) ---------- */
  .item-card{background:var(--card);border-radius:16px;padding:16px 18px;margin-bottom:12px;}
  .item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .item-title{font-weight:700;font-size:15px;color:var(--white);}
  .item-sub{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.5;}
  .item-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .mini-btn{background:var(--pill-2);color:var(--white);border:none;border-radius:999px;padding:8px 14px;font-size:12px;cursor:pointer;}
  .mini-btn.lime{background:var(--lime);color:#111;font-weight:700;}
  .mini-btn.danger{background:var(--danger);color:#fff;}
  .mini-select{background:var(--pill-2);border:1px solid #3d3d3f;border-radius:8px;color:var(--white);padding:7px 10px;font-size:12px;outline:none;}
  .pin-badge{background:var(--lime);color:#111;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;}
  .empty-mini{color:var(--muted);font-size:13px;padding:20px 4px;text-align:center;}

  /* ---------- ACTIVITY LOG ---------- */
  .log-item{padding:12px 0;border-bottom:1px solid #232325;font-size:13px;}
  .log-item .log-msg{color:var(--white);}
  .log-item .log-time{color:var(--muted);font-size:11px;margin-top:3px;}

  /* ---------- SETTINGS ROW ---------- */
  .settings-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:12px;}
  .settings-row .s-lbl{font-size:14px;color:var(--white);}
  .toggle-switch{width:46px;height:26px;border-radius:999px;background:var(--pill);position:relative;cursor:pointer;flex:0 0 auto;}
  .toggle-switch.on{background:var(--lime);}
  .toggle-switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;}
  .toggle-switch.on .knob{left:23px;background:#111;}
  .mute-btn{color:var(--muted);font-size:13px;cursor:pointer;padding:6px 10px;}
  .mute-btn.active{color:var(--lime);}

  /* ================= VISUAL OVERHAUL: GLASSMORPHISM + 3D ================= */
  body{
    background:
      radial-gradient(circle at 12% 8%, rgba(198,255,46,.16), transparent 42%),
      radial-gradient(circle at 88% 18%, rgba(90,150,255,.14), transparent 40%),
      radial-gradient(circle at 25% 92%, rgba(255,90,200,.10), transparent 45%),
      var(--bg);
    background-attachment:fixed;
  }
  body.theme-light{
    background:
      radial-gradient(circle at 12% 8%, rgba(198,255,46,.22), transparent 42%),
      radial-gradient(circle at 88% 18%, rgba(90,150,255,.18), transparent 40%),
      radial-gradient(circle at 25% 92%, rgba(255,90,200,.14), transparent 45%),
      var(--bg);
    background-attachment:fixed;
  }
  #app{background:transparent;}

  /* --- glass surfaces --- */
  .topbar{backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);background:rgba(255,255,255,.03);border-bottom:1px solid rgba(255,255,255,.06);}
  .login-card,.dropdown,.item-card,.task-card,.pay-card,.stat-card,.user-list-item,.settings-row,.log-item{
    background:rgba(255,255,255,.045);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .log-item{border-left:none;border-right:none;border-top:none;border-radius:0;}
  .search-bar,.form-input,.form-textarea,.thread-input,.mini-select,.status-select{
    background:rgba(255,255,255,.05)!important;
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.10)!important;
  }
  .tab,.admin-tab,.chip{
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.07);
  }
  .tab.active,.admin-tab.active,.chip.active{
    background:linear-gradient(135deg, rgba(198,255,46,.9), rgba(198,255,46,.65));
    border-color:transparent;
    box-shadow:0 4px 14px rgba(198,255,46,.35);
  }
  .thread-input-wrap{backdrop-filter:blur(18px);background:rgba(255,255,255,.03);}
  body.theme-light .topbar,body.theme-light .login-card,body.theme-light .dropdown,
  body.theme-light .item-card,body.theme-light .task-card,body.theme-light .pay-card,
  body.theme-light .stat-card,body.theme-light .user-list-item,body.theme-light .settings-row{
    background:rgba(255,255,255,.55);
    border-color:rgba(0,0,0,.06);
    box-shadow:0 8px 24px rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.6);
  }

  /* --- 3D depth: elevate + press --- */
  .task-card,.pay-card,.item-card,.stat-card,.chat-row,.user-list-item{
    transform:translateZ(0);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .task-card:active,.pay-card:active,.item-card:active,.chat-row:active{
    transform:translateY(2px) scale(.99);
    box-shadow:0 3px 10px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .stat-card{position:relative;overflow:hidden;}
  .stat-card::after{content:'';position:absolute;top:-40%;right:-30%;width:80px;height:80px;background:radial-gradient(circle, rgba(198,255,46,.25), transparent 70%);pointer-events:none;}
  .form-btn,.btn-login,.mini-btn{
    box-shadow:0 4px 12px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .form-btn:active,.btn-login:active,.mini-btn:active{
    transform:translateY(1px) scale(.97);
    box-shadow:0 2px 6px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.1);
  }
  .send-btn{box-shadow:0 3px 10px rgba(230,200,0,.3);}
  .avatar{box-shadow:0 4px 10px rgba(0,0,0,.35), inset 0 -2px 4px rgba(0,0,0,.08);}
  .msg-bubble,.bc-bubble{box-shadow:0 3px 10px rgba(0,0,0,.25);}

  /* ---------- ICONS ---------- */
  .icon{width:16px;height:16px;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .mini-btn .icon{margin-right:4px;}
  .back-row .icon,.thread-back-svg{width:20px;height:20px;stroke:var(--lime);}

  /* ---------- MODAL ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:500;padding:24px;}
  .modal-box{
    background:rgba(30,30,32,.85);
    backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;padding:26px 22px;max-width:340px;width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  body.theme-light .modal-box{background:rgba(255,255,255,.9);border-color:rgba(0,0,0,.08);}
  .modal-title{font-size:16px;font-weight:700;margin-bottom:10px;color:var(--white);}
  .modal-msg{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:18px;}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions .mini-btn{flex:1;padding:12px;font-size:13px;}

  /* ---------- ANALYTICS ---------- */
  .chart-card{background:rgba(255,255,255,.045);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.3);}
  .chart-card h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:0 0 16px;font-weight:600;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .bar-lbl{width:78px;flex:0 0 auto;font-size:12px;color:var(--muted);}
  .bar-track{flex:1;height:14px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--lime),#8fe000);box-shadow:0 0 8px rgba(198,255,46,.5);}
  .bar-val{width:34px;flex:0 0 auto;font-size:12px;color:var(--white);text-align:right;font-weight:700;}
  .declined-tag{display:inline-block;background:rgba(255,90,90,.15);color:var(--danger);font-size:11px;padding:3px 9px;border-radius:999px;margin-top:6px;}
  .msg-reply-quote{background:rgba(255,255,255,.08);border-left:3px solid var(--lime);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted);margin-bottom:4px;max-width:80%;}
  .msg-edited{font-size:10px;color:var(--muted);font-style:italic;}
  .msg-actions{display:flex;gap:10px;font-size:11px;color:var(--muted);margin-top:2px;cursor:pointer;}
  .msg-actions span{opacity:.7;}
  .msg-actions span:hover{opacity:1;text-decoration:underline;}
  .reply-preview-bar{display:flex;align-items:center;justify-content:space-between;background:rgba(198,255,46,.08);border-left:3px solid var(--lime);border-radius:8px;padding:8px 12px;margin:0 12px 6px 12px;font-size:12px;}
  .reply-preview-text{color:var(--white);opacity:.9;}
  #cancelReply{cursor:pointer;color:var(--muted);font-size:16px;padding:0 6px;}
  .reaction-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px;}
  .reaction-chip{background:rgba(255,255,255,.08);border-radius:999px;padding:2px 8px;font-size:12px;cursor:pointer;}
  .reaction-chip.mine{background:rgba(198,255,46,.2);border:1px solid var(--lime);}
  .react-picker{display:flex;gap:8px;background:var(--bg-elev);border-radius:12px;padding:6px 10px;margin-top:4px;font-size:20px;width:fit-content;}
  .react-picker span{cursor:pointer;}
  .msg-block, .bc-msg{touch-action:pan-y;user-select:none;}
  .msg-action-menu{position:fixed;z-index:900;background:rgba(30,30,32,.98);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);padding:8px;min-width:170px;}
  body.theme-light .msg-action-menu{background:rgba(255,255,255,.98);border-color:rgba(0,0,0,.08);}
  .quick-react-row{display:flex;gap:6px;padding:4px 4px 8px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:4px;font-size:22px;}
  .quick-react-row span{cursor:pointer;transition:transform .1s;}
  .quick-react-row span:active{transform:scale(1.3);}
  .msg-action-item{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px;}
  .msg-action-item:active{background:rgba(198,255,46,.15);}
  .thread-status{font-size:11px;color:var(--lime);opacity:.85;margin-top:1px;}
  .online-dot{position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:var(--lime);border:2.5px solid var(--bg);z-index:2;}
</style>

const KEYS = { USERS:'panel:users', CHATS:'panel:chats', BROADCAST:'panel:broadcast', TASKS:'panel:tasks', PAYMENTS:'panel:payments', ACTIVITY:'panel:activity', MUTED:'panel:muted', LASTSEEN:'panel:lastseen', THEME:'panel:theme', LOGINHISTORY:'panel:loginhistory', SESSION:'panel:session' };

/* ---- shared storage: backed by Supabase table panel_data(key, value) ---- */
async function sGet(key){
  try{
    const { data, error } = await sb.from('panel_data').select('value').eq('key', key).maybeSingle();
    if(error){ console.error('sGet error', key, error); return null; }
    return data ? data.value : null;
  }catch(e){ console.error('sGet failed', key, e); return null; }
}
async function sSet(key, value){
  try{
    const { error } = await sb.from('panel_data').upsert({ key, value, updated_at: new Date().toISOString() });
    if(error) console.error('sSet failed', key, error);
  }catch(e){ console.error('sSet failed', key, e); }
}
/* ---- personal (per-device) storage: session marker only, stays local ---- */
async function pGet(key){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
  catch(e){ return null; }
}
async function pSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ console.error('local set failed', key, e); }
}
async function pDelete(key){
  try{ localStorage.removeItem(key); }
  catch(e){ /* ignore */ }
}

const audioNotif = new Audio(SND_NOTIF);
const audioLive  = new Audio(SND_LIVE);
const audioSend  = new Audio(SND_SEND);
[audioNotif, audioLive, audioSend].forEach(a => { a.preload = 'auto'; });

let audioUnlocked = false;
function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  [audioNotif, audioLive, audioSend].forEach(a=>{
    a.play().then(()=>{ a.pause(); a.currentTime = 0; }).catch(()=>{});
  });
}
document.addEventListener('click', unlockAudio, { once:true });

function playSound(kind){
  let a;
  if(kind==='notif') a = audioNotif;
  else if(kind==='live') a = audioLive;
  else if(kind==='send') a = audioSend;
  else return;
  try{ a.currentTime = 0; a.play().catch(()=>{}); }catch(e){}
}

/* ---- browser push notification (for background messages) ---- */
function requestNotifPermission(){
  if(typeof Notification === 'undefined') return;
  if(Notification.permission === 'default'){
    Notification.requestPermission().catch(()=>{});
  }
}
function showBrowserNotification(title, body){
  if(typeof Notification === 'undefined') return;
  if(Notification.permission !== 'granted') return;
  try{
    const n = new Notification(title, { body, icon: './icon-192.png', badge: './icon-192.png', tag: 'mandaleditz-msg' });
    n.onclick = ()=>{ window.focus(); n.close(); };
  }catch(e){}
}

async function loadAll(){
  // NOTE: users are NOT auto-seeded from here anymore, on purpose.
  // Seed the first admin user via supabase-schema.sql (hashed password),
  // then create everyone else through the app's admin panel.
  // All 10 reads fired together instead of one-after-another: this alone turns
  // ~10 sequential round-trips into 1, which is most of the real load-time win.
  const [users, chats, broadcast, tasks, payments, activity, muted, lastSeen, themes, loginHistory] =
    await Promise.all([
      sGet(KEYS.USERS), sGet(KEYS.CHATS), sGet(KEYS.BROADCAST), sGet(KEYS.TASKS),
      sGet(KEYS.PAYMENTS), sGet(KEYS.ACTIVITY), sGet(KEYS.MUTED), sGet(KEYS.LASTSEEN),
      sGet(KEYS.THEME), sGet(KEYS.LOGINHISTORY)
    ]);

  state.users = users || [];
  state.chats = chats || seedChats();
  state.broadcast = broadcast || SEED_BROADCAST;
  state.tasks = tasks || SEED_TASKS;
  state.payments = payments || SEED_PAYMENTS;
  state.activity = activity || [];
  state.muted = muted || {};
  state.lastSeen = lastSeen || {};
  state.themes = themes || {};
  state.loginHistory = loginHistory || [];

  // if anything was missing on the server, seed it there too (fire-and-forget, doesn't block the UI)
  if(!chats) sSet(KEYS.CHATS, state.chats);
  if(!broadcast) sSet(KEYS.BROADCAST, state.broadcast);
  if(!tasks) sSet(KEYS.TASKS, state.tasks);
  if(!payments) sSet(KEYS.PAYMENTS, state.payments);
  if(!activity) sSet(KEYS.ACTIVITY, state.activity);
  if(!muted) sSet(KEYS.MUTED, state.muted);
  if(!lastSeen) sSet(KEYS.LASTSEEN, state.lastSeen);
  if(!themes) sSet(KEYS.THEME, state.themes);
  if(!loginHistory) sSet(KEYS.LOGINHISTORY, state.loginHistory);

  primeMsgCounts();
  saveLocalCache();
}

/* ---- local cache: everything needed to paint the UI instantly on next open ----
   This is a read-through cache, not the source of truth — Supabase stays the
   source of truth and always overwrites this right after a fresh fetch. */
const CACHE_KEY = 'panel:cache:snapshot';
function loadLocalCache(){
  try{
    const v = localStorage.getItem(CACHE_KEY);
    return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}
function saveLocalCache(){
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      users: state.users, chats: state.chats, broadcast: state.broadcast,
      tasks: state.tasks, payments: state.payments, activity: state.activity,
      muted: state.muted, lastSeen: state.lastSeen, themes: state.themes,
      loginHistory: state.loginHistory, ts: Date.now()
    }));
  }catch(e){ /* storage full/unavailable — ignore, Supabase is still the source of truth */ }
}
function applyLocalCache(cache){
  state.users = cache.users || []; state.chats = cache.chats || {};
  state.broadcast = cache.broadcast || []; state.tasks = cache.tasks || [];
  state.payments = cache.payments || []; state.activity = cache.activity || [];
  state.muted = cache.muted || {}; state.lastSeen = cache.lastSeen || {};
  state.themes = cache.themes || {}; state.loginHistory = cache.loginHistory || [];
  primeMsgCounts();
}

/* ---- baseline snapshot so the first poll after load doesn't fire sounds for old data ---- */
function primeMsgCounts(){
  const counts = {};
  Object.keys(state.chats).forEach(k => { counts[k] = (state.chats[k]||[]).length; });
  state._msgCounts = counts;
  state._bcCount = state.broadcast.length;
}

/* ---- helpers for new features ---- */
function myMuted(){ return state.muted[state.currentUser.id] || []; }
function isMuted(name){ return myMuted().includes(name); }
async function toggleMute(name){
  const list = state.muted[state.currentUser.id] || [];
  const idx = list.indexOf(name);
  if(idx>-1) list.splice(idx,1); else list.push(name);
  state.muted[state.currentUser.id] = list;
  await sSet(KEYS.MUTED, state.muted);
  render();
}
function myLastSeen(){
  if(!state.lastSeen[state.currentUser.id]) state.lastSeen[state.currentUser.id] = { chats:{}, broadcast:0, tasks:0 };
  return state.lastSeen[state.currentUser.id];
}
async function markSeen(category, subKey){
  const ls = myLastSeen();
  if(category==='chats') ls.chats[subKey] = Date.now();
  else ls[category] = Date.now();
  await sSet(KEYS.LASTSEEN, state.lastSeen);
}
function hasUnreadChats(){
  const ls = myLastSeen();
  return otherUsers().some(u=>{
    if(isMuted(u.name)) return false;
    const key = chatKey(u.name, state.currentUser.name);
    const msgs = state.chats[key] || [];
    const last = msgs[msgs.length-1];
    if(!last) return false;
    const seen = ls.chats[key] || 0;
    return last.sender !== state.currentUser.name && (last.ts||0) > seen;
  });
}
function hasUnreadBroadcast(){
  const ls = myLastSeen();
  const last = state.broadcast[state.broadcast.length-1];
  if(!last) return false;
  return last.sender !== state.currentUser.name && (last.ts||0) > (ls.broadcast||0);
}
function hasUnreadTasks(){
  const ls = myLastSeen();
  const last = state.tasks[0];
  if(!last) return false;
  return (last.ts||0) > (ls.tasks||0);
}
async function logActivity(msg){
  state.activity.unshift({ actor: state.currentUser.name, msg, ts: Date.now(), time: nowTime() });
  if(state.activity.length>50) state.activity.length = 50;
  await sSet(KEYS.ACTIVITY, state.activity);
}
async function applyTheme(){
  const t = state.themes[state.currentUser?.id] || 'dark';
  document.body.classList.toggle('theme-light', t==='light');
}
async function toggleTheme(){
  const cur = state.themes[state.currentUser.id] || 'dark';
  state.themes[state.currentUser.id] = cur==='dark' ? 'light' : 'dark';
  await sSet(KEYS.THEME, state.themes);
  applyTheme();
  render();
}

function nowTime(){
  const d = new Date();
  let h = d.getHours(); const m = d.getMinutes().toString().padStart(2,'0');
  const ap = h >= 12 ? 'pm' : 'am'; h = h % 12; if(h===0) h = 12;
  return `${h}:${m} ${ap}`;
}
function todayDate(){
  const d = new Date();
  return `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear().toString().slice(-2)}`;
}

let toastTimer = null;
let justEnteredThread = false;
function showToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

  applyTheme();

  app.innerHTML = `

      ${renderScreenBody()}

}

/* ---- generic modal (replaces window.confirm / window.prompt, which are
   blocked inside the sandboxed artifact preview) ---- */
function openConfirmModal(message, onYes){
  state.modal = { type:'confirm', message, onYes };
  render();
}
function openPromptModal(message, onSubmit, placeholder){
  state.modal = { type:'prompt', message, onSubmit, value:'', placeholder: placeholder||'' };
  render();
}
function closeModal(){ state.modal = null; render(); }

function renderModal(){
  if(!state.modal) return '';
  const m = state.modal;
  if(m.type==='confirm'){
    return `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <div class="modal-title">Please confirm</div>
        <div class="modal-msg">${escapeHtml(m.message)}</div>
        <div class="modal-actions">
          <button class="mini-btn" id="modalCancel">Cancel</button>
          <button class="mini-btn danger" id="modalConfirm">${ICO.trash}Confirm</button>
        </div>
      </div>
    </div>`;
  }
  if(m.type==='prompt'){
    return `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <div class="modal-title">${escapeHtml(m.message)}</div>
        <input class="form-input" id="modalInput" placeholder="${escapeHtml(m.placeholder)}" autocomplete="off" />
        <div class="modal-actions">
          <button class="mini-btn" id="modalCancel">Cancel</button>
          <button class="mini-btn lime" id="modalSubmit">${ICO.key}Save</button>
        </div>
      </div>
    </div>`;
  }
  return '';
}

function attachModalEvents(){
  if(!state.modal) return;
  const cancel = document.getElementById('modalCancel');
  if(cancel) cancel.onclick = closeModal;
  if(state.modal.type==='confirm'){
    const ok = document.getElementById('modalConfirm');
    if(ok) ok.onclick = ()=>{ const fn = state.modal.onYes; state.modal=null; fn && fn(); };
  }
  if(state.modal.type==='prompt'){
    const input = document.getElementById('modalInput');
    if(input) input.focus();
    const submit = document.getElementById('modalSubmit');
    const doSubmit = ()=>{
      const val = input.value.trim();
      if(!val){ showToast('Enter a value'); return; }
      const fn = state.modal.onSubmit; state.modal=null; fn && fn(val);
    };
    if(submit) submit.onclick = doSubmit;
    if(input) input.addEventListener('keydown', e=>{ if(e.key==='Enter') doSubmit(); });
  }
}

function otherUsers(){
  return state.users.filter(u => u.name !== state.currentUser.name);
}

function renderChatsTab(){
  const q = state.searchQuery.toLowerCase();
  let list = otherUsers().filter(u => u.name.toLowerCase().includes(q));
  if(list.length===0) return `<div class="empty-state">No chats found.</div>`;
  const ls = myLastSeen();
  list = list.map(u=>{
    const key = chatKey(u.name, state.currentUser.name);
    const msgs = state.chats[key] || [];
    const last = msgs[msgs.length-1];
    return { u, key, msgs, last };
  }).sort((a,b)=>(b.last?b.last.ts:0) - (a.last?a.last.ts:0));
  return list.map(({u,key,last})=>{
    const muted = isMuted(u.name);
    const seenTs = ls.chats[key] || 0;
    const unread = !muted && last && last.sender !== state.currentUser.name && (last.ts||0) > seenTs;
    let tick = '';
    if(last && last.sender === state.currentUser.name){
      const otherSeen = (state.lastSeen[u.id]?.chats?.[key]) || 0;
      tick = `<span class="check">${otherSeen >= last.ts ? '✓✓' : '✓'}</span> `;
    }
    return `
    <div class="chat-row ${unread?'unread':''}" data-chat="${u.name}" style="${muted?'opacity:.55;':''}">
      <div class="avatar">${u.avatar ? `<img src="${escapeHtml(u.avatar)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : PERSON_SVG}${state.onlineUsers && state.onlineUsers.has(u.name) ? '<span class="online-dot"></span>' : ''}</div>
      <div class="chat-meta">
        <div class="chat-name">${u.name}${muted?' '+ICO.bellOff:''}</div>
        <div class="chat-last">${tick}${last ? escapeHtml(last.text) : 'Say hi 👋'}</div>
      </div>
      <div class="chat-time">${last ? last.time : ''}</div>
    </div>`;
  }).join('');
}

}

function renderHistoryTab(){
  const me = state.currentUser.name;
  const q = state.searchQuery.toLowerCase();
  let tasks = state.tasks.filter(t => t.title.toLowerCase().includes(q) || q==='');
  if(state.taskFilter==='pending') tasks = tasks.filter(t=>t.status==='pending');
  else if(state.taskFilter==='accepted') tasks = tasks.filter(t=>t.status==='accepted');
  else if(state.taskFilter==='mine') tasks = tasks.filter(t=>t.acceptedBy===me);
  const chips = `
    <div class="chip-row">
      ${taskChip('all','All')}${taskChip('pending','Pending')}${taskChip('accepted','Accepted')}${taskChip('mine','Mine')}
    </div>`;
  if(tasks.length===0) return chips + `<div class="empty-state">No tasks right now.</div>`;
  return chips + tasks.map(t=>{
    let actionHtml = '';
    const iDeclined = (t.declinedBy||[]).includes(me);
    const iAccepted = t.acceptedBy === me;
    if(t.status === 'delivered'){
      actionHtml = iAccepted
        ? `<div class="task-status">Delivered — awaiting review</div>`
        : `<div class="task-status">Delivered by ${escapeHtml(t.acceptedBy)}</div>`;
    } else if(t.status === 'completed'){
      actionHtml = `<div class="task-status" style="color:var(--lime);">✓ Completed</div>`;
    } else if(t.status === 'accepted'){
      actionHtml = iAccepted
        ? `<div class="task-actions"><button class="btn-accept" data-deliver="${t.id}">Mark as Delivered</button></div>`
        : `<div class="task-status">Accepted By ${escapeHtml(t.acceptedBy)}</div>`;
      if(t.revisionCount) actionHtml += `<div class="declined-tag" style="color:var(--danger);">Revision requested${t.revisionNote?': '+escapeHtml(t.revisionNote):''}</div>`;
    } else if(iDeclined){
      actionHtml = `<div class="task-status declined">Declined</div>`;
    } else {
      actionHtml = `
        <div class="task-actions">
          <button class="btn-decline" data-decline="${t.id}">Decline</button>
          <button class="btn-accept" data-accept="${t.id}">Accept</button>
        </div>`;
    }
    const badges = `
      ${t.priority && t.priority!=='normal' ? `<span class="pin-badge" style="background:${t.priority==='urgent'?'rgba(255,90,90,.2)':'rgba(255,255,255,.1)'};color:${t.priority==='urgent'?'var(--danger)':'var(--muted)'};">${t.priority.toUpperCase()}</span>` : ''}
      ${t.dueDate ? `<span class="pin-badge">Due: ${escapeHtml(t.dueDate)}</span>` : ''}
      ${t.price ? `<span class="pin-badge" style="background:rgba(198,255,46,.15);color:var(--lime);">₹${escapeHtml(t.price)}</span>` : ''}
    `;
    return `
    <div class="task-card">
      <div class="task-poster">${t.postedBy}</div>
      <div class="task-row"><b>Title :</b> ${escapeHtml(t.title)}</div>
      ${badges.trim() ? `<div class="task-row">${badges}</div>` : ''}
      <div class="task-row"><b>Description:</b> ${escapeHtml(t.description)}</div>
      <div class="task-row"><b>Other details:</b></div>
      <div class="task-row task-link-row">
        <span class="link-text">${escapeHtml(t.other)}</span>
        <button class="copy-btn" data-copy="${escapeHtml(t.other)}">
          <svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
          Copy
        </button>
      </div>
      <div class="task-row"><b>Reference:</b></div>
      <div class="task-row task-link-row">
        <span class="link-text">${escapeHtml(t.reference)}</span>
        <button class="copy-btn" data-copy="${escapeHtml(t.reference)}">
          <svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
          Copy
        </button>
      </div>
      ${actionHtml}
    </div>`;
  }).join('');
}

  <div class="msg-block ${mine?'mine':''}" data-msgid="${m.id||''}">
    <div class="msg-sender">${m.sender}</div>
    ${m.replyTo ? `<div class="msg-reply-quote"><b>${escapeHtml(m.replyTo.sender)}</b><br>${escapeHtml(m.replyTo.text.slice(0,80))}</div>` : ''}
    <div class="msg-bubble">${linkify(m.text)}${m.edited?' <span class="msg-edited">(edited)</span>':''}</div>
    ${reactionHtml ? `<div class="reaction-row">${reactionHtml}</div>` : ''}

function renderMonthlyEarnings(){
  const received = state.payments.filter(p=>p.status==='Received');
  if(received.length===0) return `<div class="empty-mini">No payment data yet.</div>`;
  const byMonthUser = {};
  received.forEach(p=>{
    const month = (p.date||'').slice(0,7) || 'unknown';
    if(!byMonthUser[month]) byMonthUser[month] = {};
    byMonthUser[month][p.to] = (byMonthUser[month][p.to]||0) + Number(p.amount||0);
  });
  const months = Object.keys(byMonthUser).sort().reverse();
  return months.map(month=>{
    const rows = Object.entries(byMonthUser[month]).sort((a,b)=>b[1]-a[1]);
    const total = rows.reduce((s,[,amt])=>s+amt,0);
    return `
    <div class="item-card">
      <div class="item-title">${escapeHtml(month)} — Total ₹${total}</div>
      ${rows.map(([name,amt])=>`<div class="item-sub">${escapeHtml(name)}: ₹${amt}</div>`).join('')}
    </div>`;
  }).join('');
}

function exportPaymentsPDF(){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const pageW = doc.internal.pageSize.getWidth();
    const marginX = 14;
    let y = 16;

    function ensureSpace(needed){
      if(y + needed > 285){ doc.addPage(); y = 16; }
    }

    doc.setFontSize(15);
    doc.setFont(undefined,'bold');
    doc.text('MANDALEDITZ - Payment History Report', marginX, y);
    y += 7;
    doc.setFontSize(10);
    doc.setFont(undefined,'normal');
    doc.text(`Generated: ${todayDate()} ${nowTime()}`, marginX, y);
    y += 10;

    const rows = state.payments.slice().sort((a,b)=>(b.ts||0)-(a.ts||0));
    const totalReceived = rows.filter(p=>p.status==='Received').reduce((s,p)=>s+Number(p.amount||0),0);
    const totalPending = rows.filter(p=>p.status==='Pending').reduce((s,p)=>s+Number(p.amount||0),0);
    const totalFailed = rows.filter(p=>p.status==='Failed').reduce((s,p)=>s+Number(p.amount||0),0);

    doc.setFontSize(10);
    doc.text(`Total Received: Rs.${totalReceived}`, marginX, y);
    y += 6;
    doc.text(`Total Pending: Rs.${totalPending}`, marginX, y);
    y += 6;
    doc.text(`Total Failed: Rs.${totalFailed}`, marginX, y);
    y += 10;

    doc.setFontSize(12);
    doc.setFont(undefined,'bold');
    doc.text('All Transactions', marginX, y);
    y += 7;

    doc.setFontSize(9);
    doc.setFont(undefined,'bold');
    doc.text('Date', marginX, y);
    doc.text('To', marginX+24, y);
    doc.text('From', marginX+62, y);
    doc.text('Amount', marginX+100, y);
    doc.text('Txn ID', marginX+122, y);
    doc.text('Status', pageW-marginX-20, y);
    y += 2;
    doc.setLineWidth(0.2);
    doc.line(marginX, y, pageW-marginX, y);
    y += 5;
    doc.setFont(undefined,'normal');

    rows.forEach(p=>{
      ensureSpace(7);
      doc.text(String(p.date||''), marginX, y);
      doc.text(String(p.to||'').slice(0,18), marginX+24, y);
      doc.text(String(p.from||'').slice(0,18), marginX+62, y);
      doc.text(`Rs.${p.amount}`, marginX+100, y);
      doc.text(String(p.txn||'').slice(0,14), marginX+122, y);
      doc.text(String(p.status||''), pageW-marginX-20, y);
      y += 6;
    });

    // ---- individual monthly earnings ----
    const received = state.payments.filter(p=>p.status==='Received');
    if(received.length){
      const byMonthUser = {};
      received.forEach(p=>{
        const month = (p.date||'').slice(0,7) || 'unknown';
        if(!byMonthUser[month]) byMonthUser[month] = {};
        byMonthUser[month][p.to] = (byMonthUser[month][p.to]||0) + Number(p.amount||0);
      });
      const months = Object.keys(byMonthUser).sort().reverse();

      ensureSpace(16);
      y += 8;
      doc.setFontSize(12);
      doc.setFont(undefined,'bold');
      doc.text('Individual Monthly Earnings', marginX, y);
      y += 8;
      doc.setFontSize(9);

      months.forEach(month=>{
        const entries = Object.entries(byMonthUser[month]).sort((a,b)=>b[1]-a[1]);
        const monthTotal = entries.reduce((s,[,amt])=>s+amt,0);
        ensureSpace(8 + entries.length*6);
        doc.setFont(undefined,'bold');
        doc.text(`${month}  (Total Rs.${monthTotal})`, marginX, y);
        y += 6;
        doc.setFont(undefined,'normal');
        entries.forEach(([name,amt])=>{
          ensureSpace(6);
          doc.text(`  ${name}`, marginX+4, y);
          doc.text(`Rs.${amt}`, pageW-marginX-20, y);
          y += 6;
        });
        y += 2;
      });
    }

    const pageCount = doc.internal.getNumberOfPages();
    doc.setFontSize(8);
    for(let p=1; p<=pageCount; p++){
      doc.setPage(p);
      doc.text(`Page ${p} of ${pageCount}`, pageW/2, 293, { align:'center' });
    }

    doc.save(`mandaleditz-payments-${todayDate().replace(/\//g,'-')}.pdf`);
  }catch(e){
    console.error('PDF export failed', e);
    showToast('Could not generate PDF');
  }

}

function donutSVG(segments, size){
  size = size || 140;
  const r = size/2 - 14;
  const c = 2 * Math.PI * r;
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  let offset = 0;
  const cx = size/2, cy = size/2;
  const circles = segments.map(seg=>{
    const frac = seg.value/total;
    const dash = frac * c;
    const gap = c - dash;
    const rot = (offset/total) * 360;
    offset += seg.value;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="14"
      stroke-dasharray="${dash} ${gap}" stroke-dashoffset="0"
      transform="rotate(${rot-90} ${cx} ${cy})" stroke-linecap="round"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;">${circles}
    <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="20" font-weight="800" fill="var(--white)">${total}</text>
    <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10" fill="var(--muted)">total</text>
  </svg>`;
}

/* ---- simple user-agent parsing for login history ---- */
function detectDeviceBrowser(){
  const ua = navigator.userAgent || '';
  let device = 'Desktop';
  if(/iPhone/i.test(ua)) device = 'iPhone';
  else if(/iPad/i.test(ua)) device = 'iPad';
  else if(/Android/i.test(ua)) device = /Mobile/i.test(ua) ? 'Android Phone' : 'Android Tablet';
  else if(/Macintosh/i.test(ua)) device = 'Mac';
  else if(/Windows/i.test(ua)) device = 'Windows PC';
  else if(/Linux/i.test(ua)) device = 'Linux';

  let browser = 'Unknown Browser';
  if(/Edg\//i.test(ua)) browser = 'Edge';
  else if(/OPR\//i.test(ua) || /Opera/i.test(ua)) browser = 'Opera';
  else if(/Chrome\//i.test(ua) && !/Edg\//i.test(ua)) browser = 'Chrome';
  else if(/CriOS\//i.test(ua)) browser = 'Chrome (iOS)';
  else if(/Firefox\//i.test(ua)) browser = 'Firefox';
  else if(/Safari\//i.test(ua) && !/Chrome\//i.test(ua)) browser = 'Safari';
  return { device, browser };
}

async function recordLogin(user){
  const { device, browser } = detectDeviceBrowser();
  state.loginHistory.unshift({
    userId: user.id, name: user.name,
    date: todayDate(), time: nowTime(),
    device, browser, ts: Date.now()
  });
  if(state.loginHistory.length > 300) state.loginHistory.length = 300;
  await sSet(KEYS.LOGINHISTORY, state.loginHistory);
  registerPushIdentity(user);
}

function registerPushIdentity(user){
  const isNative = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
  if(isNative){
    try{
      const OneSignal = window.Capacitor.Plugins.OneSignal;
      if(!OneSignal) return;
      OneSignal.initialize({ appId: "7a01fc88-ca71-412a-8ec2-cbaa4315b87d" })
        .then(()=> OneSignal.login({ externalId: String(user.id) }))
        .then(()=> OneSignal.Notifications.requestPermission({ fallbackToSettings: true }))
        .catch(e=> console.error('OneSignal (native) registration failed', e));
    }catch(e){ console.error('OneSignal native plugin not available', e); }
    return;
  }
  try{
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function(OneSignal){
      try{
        await OneSignal.login(user.id);
        await OneSignal.User.addTag('name', user.name);
        if(OneSignal.Notifications && !OneSignal.Notifications.permission){
          OneSignal.Notifications.requestPermission();
        }
      }catch(e){ console.error('OneSignal registration failed', e); }
    });
  }catch(e){ console.error('OneSignal not available', e); }
}

function attachEmojiEvents(context, inputId){
  const icoSelector = `[data-emojifor="${context}"]`;
  const ico = document.querySelector(icoSelector);
  const panel = document.getElementById(`emojiPanel_${context}`);
  if(!ico || !panel) return;
  ico.onclick = (e)=>{
    e.stopPropagation();
    const isOpen = panel.style.display === 'block';
    document.querySelectorAll('.emoji-panel').forEach(p=>p.style.display='none');
    panel.style.display = isOpen ? 'none' : 'block';
  };
  panel.querySelectorAll('[data-emojicat]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      state.emojiCategory = parseInt(btn.dataset.emojicat, 10);
      const cat = EMOJI_CATS[state.emojiCategory];
      const grid = document.getElementById(`emojiGrid_${context}`);
      if(grid){
        grid.innerHTML = cat.list.map(em=>`<span class="emoji-opt" data-emoji="${em}">${em}</span>`).join('');
        attachEmojiGridClicks(grid, inputId);
      }
      panel.querySelectorAll('[data-emojicat]').forEach(b=>b.classList.toggle('active', b===btn));
    };
  });
  const grid = document.getElementById(`emojiGrid_${context}`);
  if(grid) attachEmojiGridClicks(grid, inputId);
}

function attachEmojiGridClicks(grid, inputId){
  grid.querySelectorAll('[data-emoji]').forEach(span=>{
    span.onclick = (e)=>{
      e.stopPropagation();
      const input = document.getElementById(inputId);
      if(input){ input.value += span.dataset.emoji; input.focus(); }
    };
  });

const URL_RE = /((https?:\/\/|www\.)[^\s<]+)/gi;
const TAG_RE = /(^|[\s(])@([a-zA-Z][a-zA-Z ]{0,20}?)(?=[\s.,!?)]|$)/g;
function linkify(str){
  const escaped = escapeHtml(str);
  let out = escaped.replace(URL_RE, (match)=>{
    const href = match.startsWith('http') ? match : 'https://' + match;
    return `<a href="${href}" onclick="return openExternalLink('${href.replace(/'/g,"\\'")}')" rel="noopener noreferrer" style="color:var(--lime);text-decoration:underline;word-break:break-all;">${match}</a>`;
  });
  out = out.replace(TAG_RE, (whole, pre, name)=>{
    const matched = state.users.some(u=>u.name.toLowerCase() === name.trim().toLowerCase()) || name.trim().toLowerCase() === 'all';
    if(!matched) return whole;
    return `${pre}<span style="color:var(--lime);font-weight:700;">@${escapeHtml(name)}</span>`;
  });
  return out;
}
function openExternalLink(href){
  if(state.currentUser && state.currentUser.admin){
    const ok = confirm(`Open this link in browser?\n${href}`);
    if(!ok) return false;
  }
  try{
    if(typeof window.open === 'function'){
      const w = window.open(href, '_system');
      if(w) return false;
    }
  }catch(e){}
  // fall through to default navigation (plain href) if window.open didn't work
  return true;
}

function attachMsgGestures(container, resolveMsg, ctxType){
  if(!container) return;
  container.querySelectorAll('.msg-block[data-msgid], .bc-msg[data-msgid]').forEach(el=>{
    if(!el.dataset.msgid) return;
    const bubble = el.querySelector('.msg-bubble, .bc-bubble') || el;
    let startX=0, startY=0, dragging=false, moved=false, longPressFired=false, timer=null;

    function reset(){
      bubble.style.transition = 'transform .18s ease';
      bubble.style.transform = 'translateX(0)';
      dragging = false;
    }
    function onMove(e){
      if(!dragging || longPressFired) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if(Math.abs(dx) > 8 || Math.abs(dy) > 8){ moved = true; clearTimeout(timer); }
      if(dx > 0 && Math.abs(dx) > Math.abs(dy)) bubble.style.transform = `translateX(${Math.min(dx,70)}px)`;
    }
    function onUp(e){
      clearTimeout(timer);
      document.removeEventListener('pointermove', onMove);
      if(!longPressFired){
        const dx = (e.clientX||startX) - startX;
        if(dx > 55){
          const msg = resolveMsg(el);
          if(msg) doReplyGesture(msg, ctxType);
        }
      }
      reset();
    }
    el.addEventListener('pointerdown', e=>{
      if(e.button !== undefined && e.button !== 0) return;
      startX = e.clientX; startY = e.clientY;
      dragging = true; moved = false; longPressFired = false;
      bubble.style.transition = 'none';
      timer = setTimeout(()=>{
        if(dragging && !moved){
          longPressFired = true;
          const msg = resolveMsg(el);
          if(msg){
            if(navigator.vibrate) navigator.vibrate(12);
            openMsgActionMenu(e.clientX, e.clientY, msg, ctxType);
          }
          reset();
        }
      }, 480);
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp, { once:true });
    });
  });
}

function compressImageToDataUrl(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=> reject(new Error('Could not load image'));
      img.src = e.target.result;
    };
    reader.onerror = ()=> reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---- copy to clipboard ---- */
function ensureCopyToast(){
  let el = document.getElementById('copyToast');
  if(!el){
    el = document.createElement('div');
    el.id = 'copyToast';
    el.className = 'copy-toast';
    el.textContent = 'Copied!';
    document.body.appendChild(el);
  }
  return el;
}
function showCopyToast(msg){
  const el = ensureCopyToast();
  el.textContent = msg || 'Copied!';
  el.classList.add('show');
  clearTimeout(showCopyToast._t);
  showCopyToast._t = setTimeout(()=> el.classList.remove('show'), 1800);
}
async function copyToClipboard(text, btn, fallbackEl){
  let ok = false;

  // 1) Modern Clipboard API — only trust it if it doesn't throw/reject
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  }catch(e){ ok = false; }

  // 2) Fallback: hidden textarea + execCommand — check the actual return value,
  //    some WebViews/older browsers return false instead of throwing
  if(!ok){
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.left = '0';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, text.length);
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    }catch(e){ ok = false; }
  }

  if(ok){
    showCopyToast('Copied!');
    if(btn){
      const original = btn.innerHTML;
      btn.classList.add('copied');
      btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg> Copied';
      setTimeout(()=>{ btn.classList.remove('copied'); btn.innerHTML = original; }, 1400);
    }
  } else {
    // 3) Last resort: select the visible text so the user can long-press → Copy themselves
    if(fallbackEl){
      try{
        const range = document.createRange();
        range.selectNodeContents(fallbackEl);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }catch(e){ /* ignore */ }
    }
    showCopyToast('Copy failed — text selected, long-press to copy');
  }
}

async function doLogin(){
  const id = document.getElementById('loginId').value.trim();
  const pass = document.getElementById('loginPass').value;
  let found = null;
  try{
    const { data, error } = await sb.rpc('verify_login', {
      users_json: state.users, login_id: id, login_pass: pass
    });
    if(error) console.error('verify_login failed', error);
    else found = data;
  }catch(e){ console.error('verify_login failed', e); }
  if(!found){
    state.loginError = 'Invalid User ID or Password';
    render();
    return;
  }
  state.currentUser = state.users.find(u=>u.id===found.id) || found;
  state.loginError = '';
  state.screen = 'main';
  state.activeTab = 'chats';
  await pSet(KEYS.SESSION, { userId: state.currentUser.id });

async function sendOtp(){
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  if(!email){ state.loginError = 'Enter your email'; render(); return; }
  if(!state.users.some(u=>u.email===email)){
    state.loginError = 'This email is not registered. Ask an admin to add you.';
    render();
    return;
  }
  const sendBtn = document.getElementById('sendOtpBtn');
  sendBtn.disabled = true; sendBtn.textContent = 'SENDING…';
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
  if(error){
    console.error('signInWithOtp failed', error);
    state.loginError = 'Could not send code, try again';
    render();
    return;
  }
  state.otpEmail = email;
  state.otpStep = 'code';
  state.loginError = '';
  render();
}

async function verifyOtp(){
  const code = document.getElementById('otpCode').value.trim();
  if(!code){ state.loginError = 'Enter the code'; render(); return; }
  const { data, error } = await sb.auth.verifyOtp({ email: state.otpEmail, token: code, type: 'email' });
  if(error || !data.session){
    console.error('verifyOtp failed', error);
    state.loginError = 'Invalid or expired code';
    render();
    return;
  }
  const found = state.users.find(u=>u.email === state.otpEmail);
  if(!found){
    state.loginError = 'This email is not registered. Ask an admin to add you.';
    render();
    return;
  }
  state.currentUser = found;
  state.loginError = '';
  state.otpStep = 'email';
  state.screen = 'main';
  state.activeTab = 'chats';
  await pSet(KEYS.SESSION, { userId: found.id });
  recordLogin(found);
  setupPresence();
  render();
}

/* ---- server push (background notifications via Supabase Edge Function) ---- */
async function triggerPush(toName, title, body){
  try{
    const toUser = state.users.find(u=>u.name === toName);
    if(!toUser) return;
    await fetch(`${SUPABASE_URL}/functions/v1/send-push`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      },
      body: JSON.stringify({ toUserId: toUser.id, title, body })
    });
  }catch(e){ console.error('triggerPush failed', e); }
}

async function toggleReaction(msgId, emoji){
  const key = chatKey(state.activeChatWith, state.currentUser.name);
  const msg = (state.chats[key]||[]).find(m=>m.id===msgId);
  if(!msg) return;
  if(!msg.reactions) msg.reactions = {};
  if(!msg.reactions[emoji]) msg.reactions[emoji] = [];
  const me = state.currentUser.name;
  const idx = msg.reactions[emoji].indexOf(me);
  if(idx>=0) msg.reactions[emoji].splice(idx,1);
  else msg.reactions[emoji].push(me);
  state.reactPickerFor = null;
  await sSet(KEYS.CHATS, state.chats);
  render();
}

async function sendThreadMsg(text){
  text = text.trim();
  if(!text) return;
  const key = chatKey(state.activeChatWith, state.currentUser.name);
  if(!state.chats[key]) state.chats[key] = [];
  if(state.editingMsgId){
    const msg = state.chats[key].find(m=>m.id===state.editingMsgId);
    if(msg){ msg.text = text; msg.edited = true; }
    state.editingMsgId = null;
    await sSet(KEYS.CHATS, state.chats);
    const input = document.getElementById('threadInput');
    if(input) input.value = '';
    render();
    return;
  }
  const newMsg = { id:'m'+Date.now()+Math.random().toString(36).slice(2,7), sender: state.currentUser.name, text, time: nowTime(), ts: Date.now() };
  if(state.replyingTo) newMsg.replyTo = state.replyingTo;
  state.chats[key].push(newMsg);
  state._msgCounts[key] = state.chats[key].length;
  state.replyingTo = null;
  await sSet(KEYS.CHATS, state.chats);
  playSound('send');
  triggerPush(state.activeChatWith, state.currentUser.name, text);
  const input = document.getElementById('threadInput');
  if(input) input.value = '';
  render();
}

async function sendBroadcast(text){
  text = (text||'').trim();
  if(!text) return;
  if(state.bcEditingMsgId){
    const msg = state.broadcast.find(m=>m.id===state.bcEditingMsgId);
    if(msg){ msg.text = text; msg.edited = true; }
    state.bcEditingMsgId = null;
    await sSet(KEYS.BROADCAST, state.broadcast);
    const input = document.getElementById('broadcastInput');
    if(input) input.value = '';
    render();
    return;
  }
  const newMsg = { id:'b'+Date.now()+Math.random().toString(36).slice(2,7), sender: state.currentUser.name, text, time: nowTime(), ts: Date.now(), pinned:false };
  if(state.bcReplyingTo) newMsg.replyTo = state.bcReplyingTo;
  state.broadcast.push(newMsg);
  state._bcCount = state.broadcast.length;
  state.bcReplyingTo = null;
  await sSet(KEYS.BROADCAST, state.broadcast);
  playSound('send');
  otherUsers().forEach(u => triggerPush(u.name, `${state.currentUser.name} (Broadcast)`, text));
  const input = document.getElementById('broadcastInput');
  if(input) input.value = '';
  render();
}

/* ================= LIVE POLLING (new-message sounds, notifications, auto-scroll) ================= */
let pollTimer = null;
/* ================= REALTIME: ONLINE / TYPING / LAST SEEN ================= */
let presenceChannel = null;
let typingChannel = null;
let currentTypingKey = null;
let typingRecvTimeout = null;
let typingSendThrottle = 0;
let lastSeenTouchTimer = null;
let visibilityListenerAdded = false;

function formatLastSeen(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const now = new Date();
  let h = d.getHours();
  const mm = d.getMinutes().toString().padStart(2,'0');
  const ap = h>=12 ? 'pm' : 'am';
  h = h % 12; if(h===0) h = 12;
  const timeStr = `${h}:${mm} ${ap}`;
  if(d.toDateString() === now.toDateString()) return `today at ${timeStr}`;
  const yest = new Date(now); yest.setDate(now.getDate()-1);
  if(d.toDateString() === yest.toDateString()) return `yesterday at ${timeStr}`;
  return `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')} at ${timeStr}`;
}

function updateThreadStatusDOM(){
  const el = document.getElementById('threadStatus');
  if(!el || state.screen!=='thread') return;
  const withUser = state.activeChatWith;
  const otherUser = state.users.find(u=>u.name===withUser);
  const otherOnline = state.onlineUsers && state.onlineUsers.has(withUser);
  const otherOverallSeen = otherUser && state.lastSeen[otherUser.id]?.overall;
  let statusText = '';
  if(state.typingFrom === withUser) statusText = 'Typing…';
  else if(otherOnline) statusText = 'Online';
  else if(otherOverallSeen) statusText = 'Last seen ' + formatLastSeen(otherOverallSeen);
  el.textContent = statusText;
}

function setupPresence(){
  if(!state.currentUser || presenceChannel) return;
  presenceChannel = sb.channel('online-presence', { config: { presence: { key: state.currentUser.id } } });
  presenceChannel.on('presence', { event:'sync' }, ()=>{
    const raw = presenceChannel.presenceState();
    state.onlineUsers = new Set(Object.values(raw).flat().map(p=>p.name));
    updateThreadStatusDOM();
    refreshChatListOnlineDots();
  });
  presenceChannel.subscribe(async (status)=>{
    if(status === 'SUBSCRIBED'){
      await presenceChannel.track({ name: state.currentUser.name, online_at: Date.now() });
    }
  });
  touchLastSeen();
  lastSeenTouchTimer = setInterval(touchLastSeen, 25000);
  if(!visibilityListenerAdded){
    visibilityListenerAdded = true;
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && state.currentUser) touchLastSeen(); });
  }
}

function teardownPresence(){
  if(presenceChannel){ sb.removeChannel(presenceChannel); presenceChannel = null; }
  if(lastSeenTouchTimer){ clearInterval(lastSeenTouchTimer); lastSeenTouchTimer = null; }
  teardownTypingChannel();
  state.onlineUsers = new Set();
}

async function touchLastSeen(){
  if(!state.currentUser) return;
  const ls = myLastSeen();
  ls.overall = Date.now();
  await sSet(KEYS.LASTSEEN, state.lastSeen);
}

function refreshChatListOnlineDots(){
  if(!(state.screen==='main' && state.activeTab==='chats')) return;
  document.querySelectorAll('[data-chat]').forEach(row=>{
    const dot = row.querySelector('.online-dot');
    const isOnline = state.onlineUsers.has(row.dataset.chat);
    if(isOnline && !dot){
      const avatarEl = row.querySelector('.avatar');
      if(avatarEl) avatarEl.insertAdjacentHTML('beforeend', '<span class="online-dot"></span>');
    } else if(!isOnline && dot){
      dot.remove();
    }
  });
}

function ensureTypingChannel(){
  if(!state.currentUser || !state.activeChatWith) return;
  const key = chatKey(state.activeChatWith, state.currentUser.name);
  if(currentTypingKey === key && typingChannel) return;
  teardownTypingChannel();
  currentTypingKey = key;
  typingChannel = sb.channel(`typing-${key}`);
  typingChannel.on('broadcast', { event:'typing' }, ({ payload })=>{
    if(!payload || payload.from === state.currentUser.name) return;
    state.typingFrom = payload.from;
    updateThreadStatusDOM();
    clearTimeout(typingRecvTimeout);
    typingRecvTimeout = setTimeout(()=>{ state.typingFrom = null; updateThreadStatusDOM(); }, 3000);
  });
  typingChannel.subscribe();
}
function teardownTypingChannel(){
  if(typingChannel){ sb.removeChannel(typingChannel); typingChannel = null; currentTypingKey = null; }
  state.typingFrom = null;
  clearTimeout(typingRecvTimeout);
}
function notifyTyping(){
  if(!typingChannel) return;
  const now = Date.now();
  if(now - typingSendThrottle < 1500) return;
  typingSendThrottle = now;
  typingChannel.send({ type:'broadcast', event:'typing', payload:{ from: state.currentUser.name } });
}

function startPolling(){
  if(pollTimer) return;
  pollTimer = setInterval(pollUpdates, 3000);
}
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}

async function pollUpdates(){
  if(!state.currentUser) return;
  const [chats, broadcast, tasks] = await Promise.all([
    sGet(KEYS.CHATS), sGet(KEYS.BROADCAST), sGet(KEYS.TASKS)
  ]);
  const me = state.currentUser.name;
  let newIncoming = false;
  let incomingSender = '';
  let incomingText = '';

  if(chats){
    Object.keys(chats).forEach(key=>{
      if(!key.split('__').includes(me)) { state._msgCounts[key] = (chats[key]||[]).length; return; }
      const prevCount = state._msgCounts[key] || 0;
      const list = chats[key] || [];
      if(list.length > prevCount){
        const freshMsgs = list.slice(prevCount);
        const fromOther = freshMsgs.some(m => m.sender !== me);
        const otherName = key.split('__').find(n => n !== me);
        if(fromOther && !isMuted(otherName)){
          newIncoming = true;
          const lastFresh = freshMsgs[freshMsgs.length-1];
          incomingSender = lastFresh.sender;
          incomingText = lastFresh.text;
          // live-update the open thread instantly
          if(state.screen==='thread' && chatKey(state.activeChatWith, me) === key){
            state.chats[key] = list;
            const box = document.getElementById('threadMsgs');
            if(box){
              const otherUserObj = state.users.find(u=>u.name===state.activeChatWith);
              const otherSeenTs = (otherUserObj && state.lastSeen[otherUserObj.id]?.chats?.[key]) || 0;
              box.innerHTML = list.map(m=>threadMsgBlockHtml(m, otherSeenTs)).join('');
              box.scrollTop = box.scrollHeight;
              attachMsgGestures(box, resolveThreadMsg, 'thread');
              attachReactionChipClicks(box);
            }
          }
        }
      }
      state._msgCounts[key] = list.length;
    });
    state.chats = chats;
  }

  if(broadcast){
    const prevCount = state._bcCount || 0;
    if(broadcast.length > prevCount){
      const freshMsgs = broadcast.slice(prevCount);
      const fromOther = freshMsgs.some(m => m.sender !== me);
      if(fromOther){
        newIncoming = true;
        const lastFresh = freshMsgs[freshMsgs.length-1];
        incomingSender = lastFresh.sender + ' (Broadcast)';
        incomingText = lastFresh.text;
        if(state.screen==='main' && state.activeTab==='broadcast'){
          state.broadcast = broadcast;
          const tabContent = document.getElementById('tabContent');
          if(tabContent){
            const prevInput = document.getElementById('broadcastInput');
            const prevVal = prevInput ? prevInput.value : '';
            const hadFocus = prevInput === document.activeElement;
            const prevCursor = prevInput ? prevInput.selectionStart : null;
            tabContent.innerHTML = renderBroadcastTab();
            attachEmojiEvents('broadcast', 'broadcastInput');
            tabContent.scrollTop = tabContent.scrollHeight;
            const bcInput = document.getElementById('broadcastInput');
            const bcSend = document.getElementById('broadcastSend');
            if(bcInput){
              bcInput.value = prevVal;
              if(bcSend) bcSend.onclick = ()=> sendBroadcast(bcInput.value);
              bcInput.addEventListener('keydown', e=>{ if(e.key==='Enter') sendBroadcast(bcInput.value); });
              if(hadFocus){ bcInput.focus(); if(prevCursor!==null) bcInput.selectionStart = bcInput.selectionEnd = prevCursor; }
            }
            attachMsgGestures(document.getElementById('broadcastFeed'), resolveBcMsg, 'broadcast');
          }
        }
      }
    }
    state._bcCount = broadcast.length;
    state.broadcast = broadcast;
  }

  if(tasks) state.tasks = tasks;

  saveLocalCache();

  // refresh chat list preview / unread dots if visible, without disturbing inputs
  if(state.screen==='main' && state.activeTab==='chats'){
    const tabContent = document.getElementById('tabContent');
    if(tabContent) tabContent.innerHTML = renderChatsTab();
    document.querySelectorAll('[data-chat]').forEach(row=>{
      row.onclick = ()=>{
        state.activeChatWith = row.dataset.chat; state.screen='thread';
        markSeen('chats', chatKey(row.dataset.chat, state.currentUser.name));
        justEnteredThread = true;
        render();
      };
    });
  }
  // refresh topbar unread dot regardless of screen
  const menuDots = document.getElementById('menuDots');
  if(menuDots){
    const anyUnread = hasUnreadChats() || hasUnreadBroadcast() || hasUnreadTasks();
    menuDots.innerHTML = anyUnread ? '<span class="notif-dot"></span>' : '';
  }

  if(newIncoming){
    const appActive = !document.hidden && document.hasFocus();
    if(appActive){
      playSound('live');
    } else {
      playSound('notif');
      showBrowserNotification(incomingSender || 'MANDALEDITZ', incomingText || 'You have a new message');
    }
  }
}

/* ================= INIT ================= */
(async function init(){
  document.getElementById('app').innerHTML = `
    <div class="splash-screen">
      <div class="splash-logo"><span class="m">MANDAL</span><span class="e">EDITZ</span></div>
      <div class="splash-sub">POWERED BY MANDAL INDUSTRIES</div>
      <div class="splash-spinner"></div>
    </div>`;

  const session = await pGet(KEYS.SESSION); // stays local-only, no network round trip
  const cache = loadLocalCache();

  // 1) INSTANT PAINT: if we've been opened before, render immediately from the
  //    last-known snapshot on this device — no waiting on the network at all.
  if(cache){
    applyLocalCache(cache);
    const restoredUser = session && session.userId ? state.users.find(u=>u.id===session.userId) : null;
    if(restoredUser){
      state.currentUser = restoredUser;
      state.screen = 'main';
      state.activeTab = 'chats';
      setupPresence();
    } else {
      state.screen = 'login';
    }
    render();
  }

  // 2) BACKGROUND REFRESH: fetch the real, current data from Supabase (parallel
  //    reads, so ~1 round trip) and quietly patch it in. On a fresh device with
  //    no cache yet, this is what the splash screen is waiting on.
  function withTimeout(promise, ms){
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(()=> reject(new Error('Timed out loading data')), ms))
    ]);
  }

  try{
    await withTimeout(loadAll(), 12000);
  }catch(e){
    console.error('loadAll failed or timed out', e);
    if(!cache){
      // No cache to fall back on and the network call never came back —
      // show a retry screen instead of leaving the splash spinner forever.
      document.getElementById('app').innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;color:#9a9a9d;gap:14px;padding:20px;text-align:center;">
          <div>Could not connect. Check your internet connection.</div>
          <button onclick="window.location.reload()" style="background:#c6ff2e;color:#111;border:none;border-radius:999px;padding:12px 24px;font-weight:700;">Retry</button>
        </div>`;
      return;
    }
    // We already painted from cache above, so just stay on that — the person
    // can keep using slightly-stale data instead of being stuck on a spinner.
  }

  try{ requestNotifPermission(); }catch(e){ console.error('requestNotifPermission failed', e); }
  try{ closeEmojiPanelsOnOutsideClick(); }catch(e){ console.error('closeEmojiPanelsOnOutsideClick failed', e); }

  const restoredUser = session && session.userId ? state.users.find(u=>u.id===session.userId) : null;
  if(restoredUser){
    state.currentUser = restoredUser;
    if(state.screen !== 'main'){ state.screen = 'main'; state.activeTab = 'chats'; }
    try{ setupPresence(); }catch(e){ console.error('setupPresence failed', e); }
  } else if(!cache){
    state.screen = 'login';
  }

  render();
  startPolling();
})();
</script>
